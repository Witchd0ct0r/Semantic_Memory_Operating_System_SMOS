[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smos"
version = "0.2.0"
description = "Semantic Memory Operating System — a self-hosted store with exact-text retrieval over an authenticated HTTP API"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["memory", "semantic", "retrieval", "requirements", "api"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1",
    "faiss-cpu>=1.8.0",
    "sentence-transformers>=3.0.0,<4.0.0",
    "pydantic>=2.5.0,<3.0.0",
    "numpy>=1.26.0",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27",
]

[project.scripts]
smos-server = "smos.api.main:run"

[project.urls]
Homepage = "https://github.com/Witchd0ct0r/Semantic_Memory_Operating_System_SMOS"
Repository = "https://github.com/Witchd0ct0r/Semantic_Memory_Operating_System_SMOS"
Issues = "https://github.com/Witchd0ct0r/Semantic_Memory_Operating_System_SMOS/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["smos*"]

[tool.setuptools.package-data]
"smos.admin" = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
