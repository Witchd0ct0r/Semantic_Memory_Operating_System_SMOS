<svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg" role="img">
<title>SMOS two-stage retrieval with iterative disambiguation loop</title>
<desc>A user's hard question goes to the agent, which runs Stage 1 lean retrieval producing an overview plus candidate clusters and facets. The agent asks the user to either pick a sense-branch or narrow the case. A decision node checks whether candidates have converged to one topic; if not, the loop repeats and may re-anchor to a different branch (illustrated by the query Python fanning to language, snake, and comedy). Once converged, Stage 2 returns exact verbatim segments with neighbor expansion and reconstruction, yielding a lean, exact context.</desc>
<defs>
<marker id="r_arr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="var(--border-strong)"/></marker>
<marker id="r_arrA" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="var(--text-accent)"/></marker>
<style>
svg{--text-primary:#2c2b28;--text-secondary:#5f5e5a;--text-muted:#8a8981;--border:#d8d6cd;--border-strong:#b7b5ac;--surface-0:#ECEAFB;--surface-1:#ffffff;--text-accent:#5a4fc0;--font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-family:var(--font-sans)}
.h{font-size:13px;font-weight:600;fill:var(--text-primary)}
.sub{font-size:10.5px;fill:var(--text-secondary)}
.title{font-size:16px;font-weight:700;fill:var(--text-primary)}
.box{fill:var(--surface-1);stroke:var(--border-strong);stroke-width:1.5}
.stage{fill:var(--surface-0);stroke:var(--text-accent);stroke-width:1.75}
.chip{font-size:9.5px;font-weight:700;fill:var(--text-accent);letter-spacing:.5px}
.dia{fill:var(--surface-0);stroke:var(--text-accent);stroke-width:1.75}
.diat{font-size:10px;font-weight:600;fill:var(--text-primary)}
.ln{stroke:var(--border-strong);stroke-width:1.5}
.loop{stroke:var(--text-accent);stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.looptx{font-size:10px;font-weight:600;fill:var(--text-accent)}
.pill{fill:var(--surface-1);stroke:var(--border);stroke-width:1}
.pt{font-size:10px;fill:var(--text-primary)}
.cap{font-size:9.5px;fill:var(--text-muted)}
.fanln{stroke:var(--border-strong);stroke-width:1}
</style>
</defs>

<rect x="0" y="0" width="900" height="700" fill="#F4F2EC"/>

<text x="380" y="26" text-anchor="middle" class="title">Two-Stage Retrieval — with iterative disambiguation</text>

<rect x="150" y="44" width="460" height="46" rx="8" class="box"/>
<text x="380" y="66" text-anchor="middle" class="h">User asks a hard question</text>
<text x="380" y="81" text-anchor="middle" class="sub">"consequences of X in Hungary" · "everything about Python"</text>
<line x1="380" y1="90" x2="380" y2="110" class="ln" marker-end="url(#r_arr)"/>

<rect x="150" y="112" width="460" height="38" rx="8" class="box"/>
<text x="380" y="136" text-anchor="middle" class="h">Agent queries the tool  (re-query on each loop)</text>
<line x1="380" y1="150" x2="380" y2="170" class="ln" marker-end="url(#r_arr)"/>

<rect x="150" y="172" width="460" height="86" rx="8" class="stage"/>
<text x="166" y="190" class="chip">STAGE 1 · LEAN</text>
<text x="380" y="210" text-anchor="middle" class="h">Hybrid retrieve → compress</text>
<text x="380" y="227" text-anchor="middle" class="sub">best segments across several docs → overview</text>
<text x="380" y="243" text-anchor="middle" class="sub">+ candidate clusters / distinguishing facets</text>
<line x1="380" y1="258" x2="380" y2="278" class="ln" marker-end="url(#r_arr)"/>

<rect x="150" y="280" width="460" height="58" rx="8" class="box"/>
<text x="380" y="301" text-anchor="middle" class="h">Agent asks user: pick a branch  OR  narrow the case</text>
<text x="380" y="317" text-anchor="middle" class="sub">distinct clusters → which sense? · one cluster → which detail?</text>
<line x1="380" y1="338" x2="380" y2="356" class="ln" marker-end="url(#r_arr)"/>

<polygon class="dia" points="380,356 486,400 380,444 274,400"/>
<text x="380" y="396" text-anchor="middle" class="diat">converged to</text>
<text x="380" y="409" text-anchor="middle" class="diat">one topic?</text>

<text x="396" y="462" class="looptx">Yes</text>
<line x1="380" y1="444" x2="380" y2="470" class="ln" marker-end="url(#r_arr)"/>

<path class="loop" d="M274,400 C150,400 118,300 118,150 C118,138 126,131 138,131" marker-end="url(#r_arrA)"/>
<text x="104" y="290" text-anchor="middle" class="looptx" transform="rotate(-90 104 290)">No · repeat — may re-anchor to another branch</text>

<rect x="150" y="472" width="460" height="104" rx="8" class="stage"/>
<text x="166" y="490" class="chip">STAGE 2 · EXACT</text>
<text x="380" y="510" text-anchor="middle" class="h">Exact retrieve — verbatim segments</text>
<text x="380" y="527" text-anchor="middle" class="sub">no compression · tightly scoped to the chosen topic</text>
<text x="380" y="543" text-anchor="middle" class="sub">±1 neighbor expansion (replaces RAG overlap)</text>
<text x="380" y="559" text-anchor="middle" class="sub">reconstruct(doc_id) → whole document on demand</text>
<line x1="380" y1="576" x2="380" y2="596" class="ln" marker-end="url(#r_arr)"/>

<rect x="150" y="598" width="460" height="46" rx="8" class="box"/>
<text x="380" y="620" text-anchor="middle" class="h">Lean, exact context to the agent</text>
<text x="380" y="635" text-anchor="middle" class="sub">far smaller than dumping raw documents into context</text>

<rect x="648" y="200" width="118" height="30" rx="6" class="box"/>
<text x="707" y="219" text-anchor="middle" class="h">query: "Python"</text>
<line x1="766" y1="215" x2="808" y2="188" class="fanln"/>
<line x1="766" y1="215" x2="808" y2="238" class="fanln"/>
<line x1="766" y1="215" x2="808" y2="288" class="fanln"/>
<rect x="808" y="176" width="80" height="24" rx="12" class="pill"/>
<text x="848" y="192" text-anchor="middle" class="pt">language</text>
<rect x="808" y="226" width="80" height="24" rx="12" class="pill"/>
<text x="848" y="242" text-anchor="middle" class="pt">snake</text>
<rect x="808" y="276" width="80" height="24" rx="12" class="pill"/>
<text x="848" y="292" text-anchor="middle" class="pt">comedy</text>
<text x="648" y="320" class="cap">one query → several senses;</text>
<text x="648" y="333" class="cap">each answer can pivot the topic</text>

<rect x="648" y="470" width="14" height="14" rx="3" class="stage"/>
<text x="670" y="481" class="cap">accent = two-stage</text>
<text x="670" y="494" class="cap">machinery</text>
<line x1="650" y1="512" x2="662" y2="512" class="loop"/>
<text x="670" y="516" class="cap">dashed = clarify loop</text>
</svg>
